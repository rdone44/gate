name: "GitHub Actions Gate"
description: "Deterministic acceptance gate — verifies task + commit + CI + test report before delivery."
branding:
  color: blue
  icon: shield
inputs:
  fixture-path:
    description: "Path to evaluation JSON"
    required: true
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - evaluate
    - --input
    - ${{ inputs.fixture-path }}
