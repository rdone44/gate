name: gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm test

      - run: node bin/gate.mjs fixtures/pass.json
        name: PASS fixture — exit 0 expected

      - run: node bin/gate.mjs fixtures/fail.json --json
        name: FAIL fixture (JSON) — exit 1 expected, non-zero proves rejection
        continue-on-error: true

      - run: |
          node bin/gate.mjs fixtures/fail.json --json; \
          if [ $? -eq 1 ]; then echo "FAIL fixture correctly rejected (exit 1)"; exit 0; \
          else echo "ERROR: expected exit 1"; exit 1; fi
        name: Verify FAIL fixture exits 1

      - run: docker build -t github-actions-gate:ci .
        name: Docker build

      - run: docker run --rm -v "$PWD/fixtures:/app/fixtures" github-actions-gate:ci fixtures/pass.json --json
        name: Docker PASS fixture (JSON)
