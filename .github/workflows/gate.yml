name: gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install

      - run: npm test

      - run: ./bin/generate-test-report.mjs
        name: Generate test-report.json artifact for gate rule 4

      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
        name: Upload test-report artifact

      - if: github.event_name == 'pull_request'
        run: node bin/gate.mjs collect --owner rdone44 --repo gate --sha ${{ github.sha }} --task "${{ github.event.pull_request.number }}" --pr "${{ github.event.pull_request.number }}" --report "test-report" --output gate-result.json
        name: Collector — real GITHUB_TOKEN, evaluate + write verdict to gate-result.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # FAIL verdict exits 1; verdict is reported in next step, not in job status

      - if: github.event_name == 'pull_request'
        run: |
          echo "=== GATE VERDICT ==="
          node -e "const v=require('./gate-result.json');console.log('verdict='+v.verdict);v.rules.forEach(r=>console.log(r.id+'='+r.verdict+' | '+r.message))"
          echo "=== END VERDICT ==="
        name: Print verdict to Actions log
        continue-on-error: true

      - if: github.event_name == 'pull_request'
        name: Export verdict to job outputs
        run: |
          VERDICT=$(node -e "console.log(require('./gate-result.json').verdict)")
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "Exported verdict=$VERDICT"
        id: gate-verdict

      - if: github.event_name == 'pull_request'
        name: Post commit status (success/failure) to GitHub
        run: |
          VERDICT=$(node -e "console.log(require('./gate-result.json').verdict)")
          if [ "$VERDICT" = "PASS" ]; then
            STATE="success"
            DESC="Gate PASS — all rules passed"
          else
            STATE="failure"
            DESC="Gate FAIL — one or more rules failed"
          fi
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state="$STATE" \
            -f description="$DESC" \
            -f context="github-actions-gate" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - if: github.event_name == 'pull_request'
        run: |
          node -e "
          const v=require('./gate-result.json');
          let body='## 🚦 Gate Verdict\n\n**'+v.verdict+'**\n\n';
          body+='| Rule | Verdict | Message |\n|------|---------|--------|\n';
          v.rules.forEach(r=>{body+='| \`'+r.id+'\` | '+r.verdict+' | '+r.message.replace(/\|/g,'\\\\|')+' |\n'});
          body+='\n---\n_Automated by github-actions-gate workflow_';
          require('fs').writeFileSync('gate-comment.md',body);
          "
          gh pr comment ${{ github.event.pull_request.number }} --body-file gate-comment.md
        name: Post verdict as PR comment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - run: node bin/gate.mjs evaluate --input fixtures/pass.json
        name: PASS fixture — exit 0 expected

      - run: node bin/gate.mjs evaluate --input fixtures/fail.json --json
        name: FAIL fixture (JSON) — exit 1 expected, non-zero proves rejection
        continue-on-error: true # 仅容忍预期失败，不覆盖 gate 判定

      - run: docker build -t github-actions-gate:ci .
        name: Docker build

      - run: docker run --rm -v "$PWD/fixtures:/app/fixtures" github-actions-gate:ci evaluate --input fixtures/pass.json --json
        name: Docker PASS fixture (JSON)

      - uses: ./. 
        name: Gate Check — action.yml with fixture-path
        with:
          fixture-path: fixtures/pass.json
